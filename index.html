<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Bard's Tongue</title>
  <meta name="description" content="Brazilian Portuguese pronunciation practice. Everything stays on this device.">
  <meta name="theme-color" content="#15121d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Same fonts as the Shawnee Home Hub. Offline, the page falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cinzel:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-top">
    <canvas class="sprite" width="18" height="26" role="img" aria-label="Christon the Cleric"></canvas>
    <a href="#board" class="brand">The Bard's Tongue
      <small>Brazilian Portuguese · Christon the Cleric's voice training</small>
    </a>
  </header>

  <!-- Tabs. app.js highlights the one you're on. -->
  <nav class="nav" id="tabs" aria-label="Screens">
    <a href="#board" data-screen="board">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3a2 2 0 0 0-2 2v1h2M6 21a2 2 0 0 1-2-2v-1h2M9 8h7M9 12h7M9 16h4"/></svg>
      Quest Board<small>Phrases</small>
    </a>
    <a href="#library" data-screen="library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg>
      Anki Library<small>Your deck</small>
    </a>
    <a href="#backup" data-screen="backup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2M9 13h6"/></svg>
      Satchel<small>Backup</small>
    </a>
  </nav>

  <!-- Each screen draws itself in here -->
  <main id="screen" tabindex="-1"></main>

  <!-- Which version is running (set in app.js) -->
  <footer class="app-version" id="app-version"></footer>

  <!-- The little message at the bottom -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Plain scripts (not modules) so the app works by double-clicking index.html.
       Order matters: helpers first, app.js last. -->
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/score.js"></script>
  <script src="js/sprite.js"></script>
  <script src="js/board.js"></script>
  <script src="js/library.js"></script>
  <script src="js/shadow.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
